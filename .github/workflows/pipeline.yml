name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_NUMBER: "AKIAIOSFODNN7EXAMPLE"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display Build Number
        run: |
          echo "Build Number: ${{ env.BUILD_NUMBER }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Test Server Syntax
        run: |
          python -m py_compile server.py
          echo "Server script syntax check passed with Build Number: ${{ env.BUILD_NUMBER }}"
